name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          SDK="$ANDROID_HOME"
          if [ -z "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "Using Android SDK at $SDK"
          echo "sdk.dir=$SDK" > local.properties
          (yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1) || true
          ("$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1) || true
      - name: Get Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle"
      - name: Point the app at its live scene
        run: |
          sed -i "s|__SCENE_URL__|https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/|" app/src/main/res/values/config.xml
          cat app/src/main/res/values/config.xml
      - name: Download Three.js into assets
        run: curl -sL https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.min.js -o app/src/main/assets/three.min.js
      - name: Build APK
        run: $HOME/gradle/gradle-8.2/bin/gradle assembleDebug --no-daemon
      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          files: app/build/outputs/apk/debug/app-debug.apk
